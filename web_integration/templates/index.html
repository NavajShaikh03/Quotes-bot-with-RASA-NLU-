<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Chatbot</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .chat-container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 450px;
        height: 80vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .chat-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
      }

      .chat-header h1 {
        font-size: 1.5rem;
        margin-bottom: 5px;
      }

      .chat-header p {
        font-size: 0.85rem;
        opacity: 0.9;
      }

      .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 0.95rem;
        line-height: 1.4;
      }

      .message.bot {
        background: #f0f2f5;
        color: #333;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
      }

      .message.user {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
      }

      .message.error {
        background: #fee;
        color: #c00;
        border: 1px solid #fcc;
      }

      .typing-indicator {
        display: none;
        padding: 12px 16px;
        background: #f0f2f5;
        border-radius: 18px;
        align-self: flex-start;
      }

      .typing-indicator span {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #999;
        border-radius: 50%;
        margin: 0 2px;
        animation: bounce 1.4s infinite ease-in-out;
      }

      .typing-indicator span:nth-child(1) {
        animation-delay: 0s;
      }
      .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-6px);
        }
      }

      .chat-input {
        padding: 15px 20px;
        border-top: 1px solid #eee;
        display: flex;
        gap: 10px;
      }

      .chat-input input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #eee;
        border-radius: 25px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.3s;
      }

      .chat-input input:focus {
        border-color: #667eea;
      }

      .chat-input button {
        padding: 12px 24px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 1rem;
        cursor: pointer;
        transition:
          transform 0.2s,
          opacity 0.2s;
      }

      .chat-input button:hover {
        transform: scale(1.05);
      }

      .chat-input button:active {
        transform: scale(0.95);
      }

      .chat-input button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <h1>Quote Bot</h1>
        <p>Share how you're feeling and get inspired!</p>
      </div>

      <div class="chat-messages" id="messages">
        <div class="message bot">
          Hello! I'm your quote companion. Tell me how you're feeling today -
          happy, sad, stressed, or need some motivation?
        </div>
      </div>

      <div class="typing-indicator" id="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="chat-input">
        <input
          type="text"
          id="userInput"
          placeholder="Type your mood, happy, sad, or motivated..."
          autocomplete="off"
        />
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <script>
      const messagesDiv = document.getElementById("messages");
      const userInput = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");
      const typingIndicator = document.getElementById("typing");
      const RASA_REST_URL = "http://localhost:5005/webhooks/rest/webhook";

      // Generate unique sender ID
      const senderId = "web_user_" + Math.random().toString(36).substr(2, 9);

      function addMessage(text, sender) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${sender}`;
        messageDiv.textContent = text;
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      function showTyping() {
        typingIndicator.style.display = "block";
        messagesDiv.appendChild(typingIndicator);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      function hideTyping() {
        typingIndicator.style.display = "none";
      }

      async function sendToRasa(message) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);

        try {
          const response = await fetch(RASA_REST_URL, {
            method: "POST",
            mode: "cors",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({
              sender: senderId,
              message: message,
            }),
            signal: controller.signal,
          });

          if (!response.ok) {
            const bodyText = await response.text();
            throw new Error(`Rasa API error ${response.status}: ${bodyText}`);
          }

          const data = await response.json();
          if (!Array.isArray(data)) {
            throw new Error("Unexpected response format from Rasa API");
          }

          return data;
        } finally {
          clearTimeout(timeoutId);
        }
      }

      async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // Add user message
        addMessage(message, "user");
        userInput.value = "";

        // Show typing indicator
        showTyping();
        sendBtn.disabled = true;

        try {
          const data = await sendToRasa(message);
          hideTyping();

          // Handle all response types from RASA
          if (data && data.length > 0) {
            data.forEach((response) => {
              if (response.text) {
                // Text response
                addMessage(response.text, "bot");
              } else if (response.buttons && response.buttons.length > 0) {
                // Button response - show buttons as text options
                const buttonTexts = response.buttons
                  .map((b) => b.title)
                  .join(", ");
                addMessage(response.text || "Please choose:", "bot");
                addMessage(`[${buttonTexts}]`, "bot");
              } else if (response.image) {
                // Image response
                addMessage(response.text || "[Image]", "bot");
              } else if (response.attachment) {
                // Attachment response
                addMessage(response.text || "[Attachment]", "bot");
              } else if (response.custom) {
                // Custom payload - try to extract useful info
                addMessage(response.text || "Received your request.", "bot");
              } else if (Object.keys(response).length > 0) {
                // Any other non-empty response
                addMessage(response.text || "Received your request.", "bot");
              }
            });
          } else {
            addMessage(
              "I didn't receive a response. Please try again.",
              "bot error",
            );
          }
        } catch (error) {
          hideTyping();
          addMessage(
            "Could not reach Rasa server. Check that Rasa is running on localhost:5005 with CORS enabled.",
            "bot error",
          );
          console.error("Error:", error);
        } finally {
          sendBtn.disabled = false;
          userInput.focus();
        }
      }

      // Event listeners
      sendBtn.addEventListener("click", sendMessage);

      userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          sendMessage();
        }
      });

      // Focus input on load
      userInput.focus();
    </script>
  </body>
</html>
